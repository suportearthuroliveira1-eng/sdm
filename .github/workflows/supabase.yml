# Aplica as migrations e o seed no Supabase de produção.
# Roda sozinho quando supabase/** muda na branch de deploy, ou pelo botão
# "Run workflow" na aba Actions.
# Segredos (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   (senha do banco do projeto)
name: Supabase · banco

on:
  workflow_dispatch:
  push:
    branches: [claude/intelligent-bohr-54teds, main]
    paths: ["supabase/**"]

concurrency: supabase-prod

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: hcknrrgbmhnqtmenovmk
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Conferir segredos
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Falta o segredo SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::Falta o segredo SUPABASE_DB_PASSWORD"; exit 1; }
      - name: Ligar ao projeto
        run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Migrations pendentes
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"
      - name: Aplicar migrations e seed
        run: supabase db push --include-seed --password "$SUPABASE_DB_PASSWORD"
